
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GesturePoint - Hand Detection</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>GesturePoint</h1>
  <p>Hand detection setup</p>

  <div class="camera-container">
    <video id="webcam" autoplay playsinline></video>
    <canvas id="output"></canvas>
  </div>

  <p id="status">Starting camera...</p>

  
<div class="data-collection">
  <h2>Collect Training Data</h2>
<p>Select the hand and gesture before recording a sample.</p>

<label for="handSelect">Choose hand:</label>

<select id="handSelect">
  <option value="right">Right hand</option>
  <option value="left">Left hand</option>
</select>

  <button id="pinchButton">Record Pinch</button>
  <button id="fistButton">Record Fist</button>
  <button id="palmButton">Record Open Palm</button>

  <p id="dataStatus">Collected samples: 0</p>
  <button id="downloadButton">Download Training Data (CSV)</button>
</div>


  <script type="module" src="script.js"></script>
</body>
</html>
