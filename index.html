
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GesturePoint - Hand Gesture Control</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-container">
    <header class="app-header">
      <h1>GesturePoint</h1>
      <p>Control your on-screen pointer using hand gestures.</p>
    </header>

    <section class="detector-section" aria-label="Hand detector">
      <div class="camera-container">
        <video
          id="webcam"
          autoplay
          playsinline
          muted
        ></video>

        <canvas id="output"></canvas>

        <div
          id="handPointer"
          aria-hidden="true"
        ></div>
      </div>

      <p id="status" role="status" aria-live="polite">
        Starting camera...
      </p>
    </section>

    <section class="data-collection">
      <h2>Collect Training Data</h2>

      <p>
        Select the hand and hold your chosen gesture
        before recording a sample.
      </p>

      <div class="form-group">
        <label for="handSelect">Choose hand:</label>

        <select id="handSelect">
          <option value="right">Right hand</option>
          <option value="left">Left hand</option>
        </select>
      </div>

      <div class="button-group">
        <button id="pinchButton" type="button">
          Record Pinch
        </button>

        <button id="fistButton" type="button">
          Record Fist
        </button>

        <button id="palmButton" type="button">
          Record Open Palm
        </button>
      </div>

      <p id="dataStatus" role="status" aria-live="polite">
        Collected samples: 0
      </p>

      <button
        id="downloadButton"
        class="download-button"
        type="button"
      >
        Download Training Data (CSV)
      </button>
    </section>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
